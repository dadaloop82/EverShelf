name: Android dependency check

# Build-only verification for the two Android projects.
#
# Why it exists: `build-kiosk.yml` / `build-health-bridge.yml` only run on `main`
# and they *publish* (keystore secrets, release tag, OTA commit). So until now a
# dependency bump reached main completely unverified — which is exactly how the
# androidx / AGP bumps of October 2026 broke both builds and had to be undone with
# follow-up commits. This job assembles a **release** APK instead, with a throwaway
# keystore that belongs to nobody: no secrets, no release, nothing published. It runs
# `assembleRelease` (not debug) on purpose — the signing path is where a release build
# dies alone (`:app:validateSigningRelease`), which is how the Health Bridge shipped a
# broken signed build unnoticed.
#
# The asymmetry between the two legs is deliberate:
#   * the kiosk has **no** Gradle wrapper (its CI uses the pinned Gradle) → `gradle`
#   * the Health Bridge ships a wrapper (jar + gradlew)                  → `./gradlew`
#     so a wrapper upgrade is really exercised, not bypassed by the pinned version.

on:
  pull_request:
    paths:
      - 'evershelf-kiosk/**'
      - 'evershelf-health-bridge/**'
      - '.github/workflows/android-deps-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: kiosk
            dir: evershelf-kiosk
            wrapper: 'false'
          - project: health-bridge
            dir: evershelf-health-bridge
            wrapper: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Kotlin 2.4 wants >= 8.14.4; stays in sync with gradle-wrapper.properties (8.14.x).
          gradle-version: '8.14.6'

      - name: Debug keystore (AGP needs one when keystore.properties is absent)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Toolchain in use
        working-directory: ${{ matrix.dir }}
        run: |
          echo "--- gradle wrapper ---"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "--- plugin versions ---"
          grep -n 'com.android.application\|org.jetbrains.kotlin.android' build.gradle.kts

      - name: Throwaway signing material (release path needs a keystore)
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          # Mirrors what the release workflows do (keystore.properties in the project
          # root, `storeFile` relative), with a key that belongs to nobody: the APK is
          # thrown away, and this is what catches a broken signing path — the failure
          # mode that only appears in :app:validateSigningRelease, never in a debug build.
          keytool -genkeypair -v \
            -keystore evershelf.jks \
            -storepass verify -alias verify -keypass verify \
            -keyalg RSA -keysize 2048 -validity 3 \
            -dname "CN=EverShelf CI verify,O=EverShelf,C=IT"
          {
            echo "storeFile=evershelf.jks"
            echo "storePassword=verify"
            echo "keyAlias=verify"
            echo "keyPassword=verify"
          } > keystore.properties

      - name: Assemble release APK (throwaway signature, nothing published)
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          if [ '${{ matrix.wrapper }}' = 'true' ] && [ -x gradlew ]; then
            echo "Building with the project wrapper (what a developer uses locally)"
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Building with the Gradle on PATH (as the release workflow does)"
            gradle assembleRelease --no-daemon --stacktrace
          fi
          find . -name '*.apk' -print
