name: Build & Release Kiosk APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'evershelf-kiosk/**'
      - '.github/workflows/build-kiosk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kiosk APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Kotlin 2.4 wants ≥ 8.14.4; keep in sync with gradle-wrapper.properties
          gradle-version: '8.14.4'

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' evershelf-kiosk/app/build.gradle.kts | grep -oP '"\K[^"]+')
          VCODE=$(grep 'versionCode' evershelf-kiosk/app/build.gradle.kts | grep -oP '\d+')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Kiosk version: $VERSION (versionCode $VCODE)"

      - name: Prepare signing keystore
        working-directory: evershelf-kiosk
        env:
          KIOSK_KEYSTORE_BASE64: ${{ secrets.KIOSK_KEYSTORE_BASE64 }}
          KIOSK_STORE_PASSWORD: ${{ secrets.KIOSK_STORE_PASSWORD }}
          KIOSK_KEY_ALIAS: ${{ secrets.KIOSK_KEY_ALIAS }}
          KIOSK_KEY_PASSWORD: ${{ secrets.KIOSK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Publishing a debug-signed APK (or a fresh debug keystore every run)
          # breaks OTA: Android refuses to update over a different signature and
          # forces uninstall. Release builds MUST use the stable project keystore.
          if [ -z "${KIOSK_KEYSTORE_BASE64:-}" ] || [ -z "${KIOSK_STORE_PASSWORD:-}" ] || [ -z "${KIOSK_KEY_ALIAS:-}" ]; then
            echo "::error::Missing KIOSK_KEYSTORE_BASE64 / KIOSK_STORE_PASSWORD / KIOSK_KEY_ALIAS secrets — refusing to publish a differently-signed APK"
            exit 1
          fi
          echo "$KIOSK_KEYSTORE_BASE64" | base64 -d > evershelf.jks
          {
            echo "storeFile=evershelf.jks"
            echo "storePassword=${KIOSK_STORE_PASSWORD}"
            echo "keyAlias=${KIOSK_KEY_ALIAS}"
            echo "keyPassword=${KIOSK_KEY_PASSWORD:-$KIOSK_STORE_PASSWORD}"
          } > keystore.properties
          echo "Using KIOSK_KEYSTORE_BASE64 for signing"
          # Fingerprint for the release notes / OTA diagnostics
          keytool -list -v -keystore evershelf.jks \
            -storepass "${KIOSK_STORE_PASSWORD}" \
            -alias "${KIOSK_KEY_ALIAS}" 2>/dev/null \
            | grep -E 'SHA1:|SHA256:|Alias name:' || true

      - name: Build release APK (stable project signature)
        run: gradle assembleRelease --no-daemon
        working-directory: evershelf-kiosk

      - name: Rename APK
        run: |
          mkdir -p artifacts
          # Prefer release; fall back to debug only if release path is missing (should not happen).
          if [ -f evershelf-kiosk/app/build/outputs/apk/release/app-release.apk ]; then
            cp evershelf-kiosk/app/build/outputs/apk/release/app-release.apk artifacts/evershelf-kiosk.apk
          else
            echo "::error::Release APK missing — refusing to ship a debug build"
            exit 1
          fi

      # Publish with a semver-compatible tag so the in-app update check can
      # compare versions numerically (tag "kiosk-1.7.0" → norm → "1.7.0").
      # Also update the "kiosk-latest" tag so the hardcoded download URL still works.
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="kiosk-${{ steps.version.outputs.name }}"
          # Delete old release with same tag if it exists (e.g. re-run on same version)
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          # Do NOT pass --latest: app releases (v1.x) own "Latest". The stable
          # download URL is the kiosk-latest alias below — /releases/latest/download/
          # evershelf-kiosk.apk would 404 after the next web release.
          gh release create "$TAG" \
            --title "EverShelf Kiosk v${{ steps.version.outputs.name }}" \
            --notes "Kiosk mode app. Scarica e installa su Android 7.0+. L'aggiornamento OTA è automatico. Download alias: https://github.com/dadaloop82/EverShelf/releases/download/kiosk-latest/evershelf-kiosk.apk" \
            artifacts/evershelf-kiosk.apk

      - name: Update kiosk-latest tag (for hardcoded download URL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete kiosk-latest --yes 2>/dev/null || true
          git push --delete origin kiosk-latest 2>/dev/null || true
          sleep 3
          gh release create kiosk-latest \
            --title "EverShelf Kiosk Latest" \
            --notes "Auto alias → kiosk-${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})" \
            --prerelease \
            artifacts/evershelf-kiosk.apk

      - name: Publish APK to releases/ for LAN OTA
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
        run: |
          cp artifacts/evershelf-kiosk.apk releases/evershelf-kiosk.apk
          printf '{"version":"%s","version_code":%s}\n' \
            "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" \
            > releases/kiosk-version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # *.apk is gitignored globally; releases/ is allow-listed in .gitignore,
          # but keep -f so a missing exception never fails the publish step again.
          git add -f releases/evershelf-kiosk.apk releases/kiosk-version.json
          if git diff --staged --quiet; then
            echo "No OTA artifact changes to commit"
          else
            git commit -m "chore(kiosk): publish APK v${{ steps.version.outputs.name }} for LAN OTA"
            # Do not fail the whole release if main moved — GitHub Release assets
            # above are already published for install/OTA from releases.github.
            git push origin HEAD:${{ github.ref_name }} || echo "::warning::LAN OTA git push failed; GitHub Release still published"
          fi

