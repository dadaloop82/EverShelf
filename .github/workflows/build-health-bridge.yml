name: Build & Release Health Bridge APK

# Publish only from main (avoids develop/main racing on the same release tags).
# Node 20 deprecation warnings from action majors are harmless; failure was tag/release race.

on:
  push:
    branches: [main]
    paths:
      - 'evershelf-health-bridge/**'
      - '.github/workflows/build-health-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Health Bridge APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Kotlin 2.4 wants ≥ 8.14.4; keep in sync with gradle-wrapper.properties
          gradle-version: '8.14.4'

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' evershelf-health-bridge/app/build.gradle.kts | grep -oP '"\K[^"]+' | head -1)
          VCODE=$(grep 'versionCode' evershelf-health-bridge/app/build.gradle.kts | grep -oP '\d+' | head -1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Health Bridge version: $VERSION (versionCode $VCODE)"

      - name: Prepare signing keystore
        working-directory: evershelf-health-bridge
        env:
          HEALTH_KEYSTORE_BASE64: ${{ secrets.HEALTH_KEYSTORE_BASE64 }}
          HEALTH_STORE_PASSWORD: ${{ secrets.HEALTH_STORE_PASSWORD }}
          HEALTH_KEY_ALIAS: ${{ secrets.HEALTH_KEY_ALIAS }}
          HEALTH_KEY_PASSWORD: ${{ secrets.HEALTH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${HEALTH_KEYSTORE_BASE64:-}" ]; then
            echo "$HEALTH_KEYSTORE_BASE64" | base64 -d > evershelf.jks
            {
              echo "storeFile=evershelf.jks"
              echo "storePassword=${HEALTH_STORE_PASSWORD}"
              echo "keyAlias=${HEALTH_KEY_ALIAS}"
              echo "keyPassword=${HEALTH_KEY_PASSWORD:-$HEALTH_STORE_PASSWORD}"
            } > keystore.properties
            echo "Using HEALTH_KEYSTORE_BASE64 for release signing"
          else
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "No HEALTH_KEYSTORE_BASE64 secret — using generated debug keystore"
          fi

      - name: Build release APK
        working-directory: evershelf-health-bridge
        run: |
          rm -f local.properties
          gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp evershelf-health-bridge/app/build/outputs/apk/release/app-release.apk \
            artifacts/evershelf-health-bridge.apk
          ls -lh artifacts/evershelf-health-bridge.apk

      - name: Publish GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.name }}"
          VCODE="${{ steps.version.outputs.code }}"
          TAG="health-bridge-${VERSION}"
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          # Delete release by ID (works even when tag is broken / 422 on gh release delete)
          delete_release_tag() {
            local tag="$1"
            local id
            id=$(gh api "repos/${REPO}/releases/tags/${tag}" --jq .id 2>/dev/null || true)
            if [ -n "${id}" ]; then
              gh api -X DELETE "repos/${REPO}/releases/${id}" >/dev/null 2>&1 || true
            fi
            git push origin ":refs/tags/${tag}" 2>/dev/null || true
          }

          delete_release_tag "$TAG"
          delete_release_tag "health-bridge-latest"
          sleep 3

          gh release create "$TAG" \
            --target "$SHA" \
            --title "EverShelf Health Bridge v${VERSION}" \
            --notes "Android gateway for Fuel Mode. Pair via QR from EverShelf → Settings → Health (URL + token). Android 9+ / Health Connect." \
            artifacts/evershelf-health-bridge.apk

          gh release create health-bridge-latest \
            --target "$SHA" \
            --title "EverShelf Health Bridge Latest" \
            --notes "Alias → ${TAG} (versionCode ${VCODE})" \
            --prerelease \
            artifacts/evershelf-health-bridge.apk

          echo "Published ${TAG} and health-bridge-latest → ${SHA}"
