name: Build & Release Health Bridge APK

# Publish only from main (avoids develop/main racing on the same release tags).
# Node 20 deprecation warnings from action majors are harmless; failure was tag/release race.

on:
  push:
    branches: [main]
    paths:
      - 'evershelf-health-bridge/**'
      - '.github/workflows/build-health-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-bridge-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Health Bridge APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Kotlin 2.4 wants ≥ 8.14.4; stays in sync with gradle-wrapper.properties (8.14.x)
          gradle-version: '8.14.6'

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' evershelf-health-bridge/app/build.gradle.kts | grep -oP '"\K[^"]+' | head -1)
          VCODE=$(grep 'versionCode' evershelf-health-bridge/app/build.gradle.kts | grep -oP '\d+' | head -1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Health Bridge version: $VERSION (versionCode $VCODE)"

      - name: Prepare signing keystore
        working-directory: evershelf-health-bridge
        env:
          HEALTH_KEYSTORE_BASE64: ${{ secrets.HEALTH_KEYSTORE_BASE64 }}
          HEALTH_STORE_PASSWORD: ${{ secrets.HEALTH_STORE_PASSWORD }}
          HEALTH_KEY_ALIAS: ${{ secrets.HEALTH_KEY_ALIAS }}
          HEALTH_KEY_PASSWORD: ${{ secrets.HEALTH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${HEALTH_KEYSTORE_BASE64:-}" ]; then
            echo "$HEALTH_KEYSTORE_BASE64" | base64 -d > evershelf.jks
            {
              echo "storeFile=evershelf.jks"
              echo "storePassword=${HEALTH_STORE_PASSWORD}"
              echo "keyAlias=${HEALTH_KEY_ALIAS}"
              echo "keyPassword=${HEALTH_KEY_PASSWORD:-$HEALTH_STORE_PASSWORD}"
            } > keystore.properties
            echo "Using HEALTH_KEYSTORE_BASE64 for release signing"
          else
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "No HEALTH_KEYSTORE_BASE64 secret — using generated debug keystore"
          fi

      - name: Build release APK
        working-directory: evershelf-health-bridge
        run: |
          rm -f local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp evershelf-health-bridge/app/build/outputs/apk/release/app-release.apk \
            artifacts/evershelf-health-bridge.apk
          ls -lh artifacts/evershelf-health-bridge.apk

      # An update must install OVER the app already on the phone: same applicationId,
      # same signing key and a HIGHER versionCode. Android refuses anything else, and the
      # only cure left is "uninstall and reinstall" — which loses the local diary queue.
      # The published metadata and APK are in this repository, so both halves are checked
      # here, before anything is published.
      - name: Guard — the APK must update the published app in place
        env:
          NEW_CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, struct, sys

          def u32(b, o): return struct.unpack_from('<I', b, o)[0]
          def u64(b, o): return struct.unpack_from('<Q', b, o)[0]

          def signer_sha256(path):
              data = open(path, 'rb').read()
              eocd = data.rfind(b'PK\x05\x06')
              if eocd < 0: return None
              cd = u32(data, eocd + 16)
              if data[cd - 16:cd] != b'APK Sig Block 42': return None
              size2 = u64(data, cd - 24)
              p = cd - 8 - size2 + 8
              pairs = {}
              while p < cd - 24:
                  ln = u64(data, p); pid = u32(data, p + 8)
                  pairs[pid] = data[p + 12:p + 8 + ln]; p += 8 + ln
              v2 = pairs.get(0x7109871a)
              if v2 is None: return None
              o = 0
              o += 4                                   # signers sequence length
              o += 4                                   # first signer length
              sd_len = u32(v2, o); o += 4
              sd = v2[o:o + sd_len]
              q = 0
              q += 4 + u32(sd, q)                      # digests
              q += 4                                   # certificates sequence length
              cl = u32(sd, q); q += 4
              return hashlib.sha256(sd[q:q + cl]).hexdigest()

          new_code = int(os.environ['NEW_CODE'])
          meta = 'releases/health-bridge-version.json'
          new_apk = 'artifacts/evershelf-health-bridge.apk'
          old_apk = 'releases/evershelf-health-bridge.apk'
          problems = []

          if os.path.exists(meta):
              prev = json.load(open(meta))
              prev_code = int(prev.get('version_code', 0))
              print(f'published versionCode={prev_code}, this build={new_code}')
              if new_code <= prev_code:
                  problems.append(
                      f'versionCode {new_code} is not greater than the published {prev_code}: '
                      'Android refuses such an APK over the installed app — bump versionCode '
                      'in evershelf-health-bridge/app/build.gradle.kts')
          else:
              print('no published metadata yet — versionCode guard skipped')

          if os.path.exists(old_apk):
              new_signer = signer_sha256(new_apk)
              old_signer = signer_sha256(old_apk)
              print(f'new signer={new_signer}\npublished signer={old_signer}')
              if not new_signer or not old_signer:
                  problems.append('could not read the APK v2 signing block')
              elif new_signer != old_signer:
                  problems.append(
                      'this APK is signed with a different key: an update would force an '
                      'uninstall. Check HEALTH_KEYSTORE_BASE64 / keystore.properties')
          else:
              print('no published APK yet — signature guard skipped')

          for p in problems:
              print('::error::' + p)
          sys.exit(1 if problems else 0)
          PY

      - name: Publish GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.name }}"
          VCODE="${{ steps.version.outputs.code }}"
          TAG="health-bridge-${VERSION}"
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          # Delete release by ID (works even when tag is broken / 422 on gh release delete)
          delete_release_tag() {
            local tag="$1"
            local id
            id=$(gh api "repos/${REPO}/releases/tags/${tag}" --jq .id 2>/dev/null || true)
            if [ -n "${id}" ]; then
              gh api -X DELETE "repos/${REPO}/releases/${id}" >/dev/null 2>&1 || true
            fi
            git push origin ":refs/tags/${tag}" 2>/dev/null || true
          }

          delete_release_tag "$TAG"
          delete_release_tag "health-bridge-latest"
          sleep 3

          gh release create "$TAG" \
            --target "$SHA" \
            --title "EverShelf Health Bridge v${VERSION}" \
            --notes "Android gateway for Fuel Mode. Pair via QR from EverShelf → Settings → Health (URL + token). Android 9+ / Health Connect." \
            artifacts/evershelf-health-bridge.apk

          gh release create health-bridge-latest \
            --target "$SHA" \
            --title "EverShelf Health Bridge Latest" \
            --notes "Alias → ${TAG} (versionCode ${VCODE})" \
            --prerelease \
            artifacts/evershelf-health-bridge.apk

          echo "Published ${TAG} and health-bridge-latest → ${SHA}"

      # A LAN-only phone may have no internet at all: the bridge asks its own server first
      # (`health_bridge_update`), so the APK must also live in the repository it serves.
      - name: Publish APK to releases/ for LAN OTA
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p releases
          cp artifacts/evershelf-health-bridge.apk releases/evershelf-health-bridge.apk
          printf '{"version":"%s","version_code":%s}\n' \
            "${{ steps.version.outputs.name }}" "${{ steps.version.outputs.code }}" \
            > releases/health-bridge-version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f releases/evershelf-health-bridge.apk releases/health-bridge-version.json
          if git diff --staged --quiet; then
            echo "No OTA artifact changes to commit"
          else
            git commit -m "chore(health-bridge): publish APK v${{ steps.version.outputs.name }} for LAN OTA"
            # Do not fail the release if the branch moved: the GitHub Release above is
            # already published for install/OTA from github.com.
            git push origin HEAD:${{ github.ref_name }} || echo "::warning::LAN OTA git push failed; GitHub Release still published"
          fi
