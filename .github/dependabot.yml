version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Local MCP server (Node.js)
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # Docker base image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # Android Gradle dependencies
  # Keep ignores in sync with evershelf-*/app/build.gradle.kts comments:
  # Kotlin 2.4 + AGP 8.5.2 + compileSdk 35 cannot take core-ktx ≥1.16,
  # Health Connect 1.2.x, or Gradle 9 / AGP 9 without a coordinated upgrade.
  - package-ecosystem: "gradle"
    directory: "/evershelf-kiosk"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # Anything that needs AGP ≥ 9 / compileSdk 37 (breaks current CI).
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.16.0"]
      - dependency-name: "androidx.appcompat:appcompat"
        versions: [">=1.8.0"]
      - dependency-name: "com.google.android.material:material"
        versions: [">=1.13.0"]
      - dependency-name: "androidx.constraintlayout:constraintlayout"
        versions: [">=2.2.0"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        versions: [">=8.6.0"]
      - dependency-name: "gradle"
        versions: [">=9.0.0"]
      - dependency-name: "org.gradle:gradle"
        versions: [">=9.0.0"]

  - package-ecosystem: "gradle"
    directory: "/evershelf-health-bridge"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.16.0"]
      - dependency-name: "androidx.appcompat:appcompat"
        versions: [">=1.8.0"]
      - dependency-name: "com.google.android.material:material"
        versions: [">=1.13.0"]
      - dependency-name: "androidx.constraintlayout:constraintlayout"
        versions: [">=2.2.0"]
      - dependency-name: "androidx.work:work-runtime-ktx"
        versions: [">=2.10.0"]
      - dependency-name: "androidx.health.connect:connect-client"
        versions: [">=1.2.0-alpha01"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        versions: [">=8.6.0"]
      - dependency-name: "gradle"
        versions: [">=9.0.0"]
      - dependency-name: "org.gradle:gradle"
        versions: [">=9.0.0"]
