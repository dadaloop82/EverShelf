# EverShelf — Apache configuration applied by the Docker image.
# Serves the app from the image root with .htaccess overrides enabled.

<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# Traefik / reverse proxy: treat forwarded HTTPS as on so .htaccess does not redirect-loop.
SetEnvIf X-Forwarded-Proto "https" HTTPS=on

# A file rewritten while it is being served must not kill the worker. Apache memory-maps the
# file it delivers, and app.js (2.1 MB, gzipped → chunked) truncated under the mapping raises
# SIGBUS: the child dies and every response it was carrying is cut mid-body, which the browser
# reports as `net::ERR_INCOMPLETE_CHUNKED_ENCODING`. `EnableMMAP off` removes only the mapping
# (sendfile stays on). The repo's .htaccess sets it too — this covers vhosts that do not read
# it (`AllowOverride None`). See docs/wiki/FAQ.md.
EnableMMAP off

# Canonical host used for the forced-HTTPS redirect (avoids reflecting a spoofed Host header).
# Uncomment and set your public hostname to enable the redirect:
# SetEnv EVERSHELF_CANONICAL_HOST pantry.example.com
# SetEnv EVERSHELF_DISABLE_HTTPS_REDIRECT 1
