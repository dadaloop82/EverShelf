# EverShelf — Apache configuration applied by the Docker image.
# Serves the app from the image root with .htaccess overrides enabled.

<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# Traefik / reverse proxy: treat forwarded HTTPS as on so .htaccess does not redirect-loop.
SetEnvIf X-Forwarded-Proto "https" HTTPS=on

# Canonical host used for the forced-HTTPS redirect (avoids reflecting a spoofed Host header).
# Uncomment and set your public hostname to enable the redirect:
# SetEnv EVERSHELF_CANONICAL_HOST pantry.example.com
