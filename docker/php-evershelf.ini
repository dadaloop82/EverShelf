; EverShelf — PHP / OPcache tuning for the Docker image.
; The whole router (api/index.php, ~19k lines) is compiled on every request
; unless OPcache is enabled, so this is the cheapest available performance win.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.save_comments=1

; Realpath cache — many __DIR__-relative includes in the router.
realpath_cache_size=4096k
realpath_cache_ttl=600

; Uploads/limits used by the importer and OCR paths.
memory_limit=512M
max_execution_time=120
upload_max_filesize=32M
post_max_size=32M
