<!doctype html><html><head><meta charset="utf-8"><title>probe</title></head><body>
<pre id="m">waiting</pre>
<script>
const T='9f102eab0147d4720bd486bbc9c8724e474bbe7a4827a5bb';
try { localStorage.setItem('evershelf_api_token', T); } catch(e) {}
const f=document.createElement('iframe');
f.id='f'; f.style.cssText='width:390px;height:844px;border:0'; f.src='/dispensa/';
document.body.appendChild(f);
setTimeout(()=>{
  try{
    const d=f.contentDocument, w=f.contentWindow;
    const rows=[...d.querySelectorAll('.inventory-item')];
    const first=rows[0];
    const nm=first&&first.querySelector('.inv-name');
    const sub=first&&first.querySelector('.inv-med-sub');
    const info=first&&first.querySelector('.inv-info');
    const out={vw:w.innerWidth, cls:(d.documentElement.className||''), rows:rows.length,
      rowH:first?Math.round(first.getBoundingClientRect().height):0,
      infoW:info?Math.round(info.getBoundingClientRect().width):0,
      nameH:nm?Math.round(nm.getBoundingClientRect().height):0,
      nameW:nm?Math.round(nm.getBoundingClientRect().width):0,
      nameText:nm?nm.textContent.trim().slice(0,30):'',
      subH:sub?Math.round(sub.getBoundingClientRect().height):0,
      subText:sub?sub.textContent.trim().slice(0,30):'',
      cards:[...d.querySelectorAll('.inventory-item')].slice(0,3).map(x=>Math.round(x.getBoundingClientRect().height))};
    document.getElementById('m').textContent='METRICS '+JSON.stringify(out);
  }catch(e){ document.getElementById('m').textContent='ERR '+e.message; }
},9000);
</script></body></html>
