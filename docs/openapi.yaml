openapi: "3.1.0"
info:
  title: EverShelf API
  description: |
    REST API for EverShelf — a self-hosted pantry management system.
    All endpoints use the query parameter `action` to determine the operation.
    
    **Base URL:** `api/index.php?action={action_name}`
    
    Rate limits apply:
    - General: 120 requests/minute
    - AI endpoints: 15 requests/minute
    - Login endpoints: 5 requests/minute
  version: "1.9.1"
  contact:
    name: Stimpfl Daniel
    email: evershelfproject@gmail.com
    url: https://evershelf.site/
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api
    description: Local server

paths:
  /index.php?action=search_barcode:
    get:
      summary: Search product by barcode in local database
      tags: [Products]
      parameters:
        - name: barcode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found

  /index.php?action=lookup_barcode:
    get:
      summary: Lookup barcode on Open Food Facts
      tags: [Products]
      parameters:
        - name: barcode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product data from Open Food Facts

  /index.php?action=product_save:
    post:
      summary: Create or update a product
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product saved

  /index.php?action=product_get:
    get:
      summary: Get product by ID
      tags: [Products]
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /index.php?action=product_delete:
    post:
      summary: Delete a product
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
      responses:
        "200":
          description: Product deleted

  /index.php?action=products_list:
    get:
      summary: List all products
      tags: [Products]
      responses:
        "200":
          description: Array of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /index.php?action=products_search:
    get:
      summary: Search products by name
      tags: [Products]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching products

  /index.php?action=inventory_list:
    get:
      summary: List all inventory items
      tags: [Inventory]
      responses:
        "200":
          description: Inventory items grouped by product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /index.php?action=inventory_add:
    post:
      summary: Add item to inventory
      tags: [Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity, location]
              properties:
                product_id:
                  type: integer
                quantity:
                  type: number
                location:
                  type: string
                  enum: [dispensa, frigo, freezer, altro]
                expiry_date:
                  type: string
                  format: date
                conf_size:
                  type: number
                vacuum:
                  type: boolean
      responses:
        "200":
          description: Item added to inventory

  /index.php?action=inventory_use:
    post:
      summary: Use/consume items from inventory
      tags: [Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity, location]
              properties:
                product_id:
                  type: integer
                quantity:
                  type: number
                location:
                  type: string
                use_all:
                  type: boolean
      responses:
        "200":
          description: Item consumed

  /index.php?action=inventory_update:
    post:
      summary: Update an inventory entry
      tags: [Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                quantity:
                  type: number
                location:
                  type: string
                expiry_date:
                  type: string
                  format: date
      responses:
        "200":
          description: Inventory entry updated

  /index.php?action=inventory_delete:
    post:
      summary: Remove an inventory entry
      tags: [Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
      responses:
        "200":
          description: Inventory entry removed

  /index.php?action=inventory_summary:
    get:
      summary: Get inventory summary (counts per location)
      tags: [Inventory]
      responses:
        "200":
          description: Summary object with counts

  /index.php?action=transactions_list:
    get:
      summary: List operations log
      tags: [Log]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Array of transactions

  /index.php?action=stats:
    get:
      summary: Get waste/consumption statistics
      tags: [Log]
      responses:
        "200":
          description: Statistics for the last 30 days

  /index.php?action=gemini_expiry:
    post:
      summary: Use AI to read expiry date from image
      tags: [AI / Gemini]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image:
                  type: string
                  description: Base64-encoded image
      responses:
        "200":
          description: Parsed expiry date

  /index.php?action=generate_recipe:
    post:
      summary: Generate a recipe based on available ingredients
      tags: [AI / Gemini]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                persons:
                  type: integer
                preferences:
                  type: object
      responses:
        "200":
          description: Generated recipe

  /index.php?action=gemini_identify:
    post:
      summary: Identify a product from photo using AI
      tags: [AI / Gemini]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image:
                  type: string
                  description: Base64-encoded image
      responses:
        "200":
          description: Identified product data

  /index.php?action=gemini_chat:
    post:
      summary: Chat with Gemini AI kitchen assistant
      tags: [AI / Gemini]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                history:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: AI response

  /index.php?action=bring_list:
    get:
      summary: Get Bring! shopping list
      tags: [Bring! Integration]
      responses:
        "200":
          description: Shopping list items

  /index.php?action=bring_add:
    post:
      summary: Add item to Bring! shopping list
      tags: [Bring! Integration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                spec:
                  type: string
      responses:
        "200":
          description: Item added

  /index.php?action=bring_remove:
    post:
      summary: Remove item from Bring! shopping list
      tags: [Bring! Integration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Item removed

  /index.php?action=bring_suggest:
    post:
      summary: Get AI shopping suggestions
      tags: [Bring! Integration]
      responses:
        "200":
          description: AI-generated shopping suggestions

  /index.php?action=smart_shopping:
    get:
      summary: Get smart shopping predictions
      tags: [Bring! Integration]
      responses:
        "200":
          description: Predicted shopping needs

  /index.php?action=save_settings:
    post:
      summary: Save server-side settings (.env values)
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Settings saved

  /index.php?action=get_settings:
    get:
      summary: Get server settings (masked passwords)
      tags: [Settings]
      responses:
        "200":
          description: Current settings

  /index.php?action=app_settings_get:
    get:
      summary: Get application settings from database
      tags: [Settings]
      responses:
        "200":
          description: App settings object

  /index.php?action=app_settings_save:
    post:
      summary: Save application settings to database
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: App settings saved

  /index.php?action=recipes_list:
    get:
      summary: List saved recipes
      tags: [Recipes]
      responses:
        "200":
          description: Array of saved recipes

  /index.php?action=recipes_save:
    post:
      summary: Save a recipe
      tags: [Recipes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Recipe saved

  /index.php?action=recipes_delete:
    post:
      summary: Delete a recipe
      tags: [Recipes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
      responses:
        "200":
          description: Recipe deleted

  /index.php?action=tts_proxy:
    post:
      summary: Proxy TTS request to external endpoint
      tags: [TTS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        "200":
          description: TTS request sent

  /index.php?action=expiry_history:
    get:
      summary: Get expiry scan history for a product
      tags: [Inventory]
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expiry history entries

  /index.php?action=notify_test:
    post:
      summary: Send a test notification through every configured channel
      description: |
        Deliberately ignores `NOTIFY_ENABLED` / `NOTIFY_EVENTS` so the button works
        while the configuration is still switched off. Blocked in demo mode.
      tags: [Notifications]
      responses:
        "200":
          description: At least one channel delivered the message
        "400":
          description: Nothing delivered — `error` carries a machine key such as
            `webhook_not_configured` or `ntfy_topic_invalid`
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  delivered:
                    type: integer
                  channels:
                    type: object
                    additionalProperties:
                      type: object
                  configured:
                    type: object
                    properties:
                      ntfy:
                        type: boolean
                      webhook:
                        type: boolean
                      ha:
                        type: boolean
                  error:
                    type: string

  /index.php?action=notify_healthcheck_test:
    post:
      summary: Fire one manual ping against the cron-watchdog URL
      description: |
        Pings the URL sent in `notify_healthcheck_url` when present (a fresh paste can
        be verified before saving), otherwise the stored URL. Nothing is recorded, so a
        manual probe never rewrites the "last run" shown for the real cron job.
      tags: [Notifications]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notify_healthcheck_url:
                  type: string
      responses:
        "200":
          description: "Ping sent (or `configured: false` when no URL is stored yet)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  configured:
                    type: boolean
                  sent:
                    type: boolean
                  http:
                    type: integer
                  error:
                    type: string
        "400":
          description: Invalid URL (`invalid_url`) or the ping failed

  /index.php?action=calendar_ics:
    get:
      summary: Expiry feed for calendar clients (ICS / WebCal)
      description: |
        Returns `text/calendar`, never JSON — this response goes to a calendar client,
        not to `fetch()`, so errors are plain text with the matching status code.
      tags: [Calendar]
      parameters:
        - name: token
          in: query
          required: true
          description: Read-only feed secret, compared in constant time
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [it, en, de, fr, es, zh]
            default: en
      responses:
        "200":
          description: The ICS feed (attachment, cached 15 min)
          content:
            text/calendar:
              schema:
                type: string
        "403":
          description: Missing or wrong token
        "404":
          description: The feed is disabled in Settings

  /index.php?action=get_ics_settings:
    get:
      summary: ICS feed status + the subscribe URL shown in Settings
      tags: [Calendar]
      responses:
        "200":
          description: Status object
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  ics_enabled:
                    type: boolean
                  ics_days:
                    type: integer
                  ics_past_days:
                    type: integer
                  ics_token:
                    type: string
                  ics_url:
                    type: string
                  ics_count:
                    type: integer

  /index.php?action=rotate_ics_token:
    post:
      summary: Mint a new ICS feed secret
      description: An enabled feed without a token would be reachable by anyone, so
        this is also the "enable" step.
      tags: [Calendar]
      responses:
        "200":
          description: The new token and the URL built from it

  /index.php?action=recipe_shopping_add:
    post:
      summary: Push a recipe's ingredients to the shopping list
      description: Accepts a full recipe object, or a `recipe_id` loaded from the
        archive, and deducts what the pantry already holds.
      tags: [Recipes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipe:
                  type: object
                recipe_id:
                  type: integer
                only_missing:
                  type: boolean
                  default: true
                dry_run:
                  type: boolean
                  default: false
                selected:
                  type: array
                  items:
                    type: string
                lang:
                  type: string
      responses:
        "200":
          description: Plan / applied changes, with a `summary` of total, missing,
            partial, covered, added and updated items
        "500":
          description: Database busy — please retry

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        brand:
          type: string
        barcode:
          type: string
        category:
          type: string
          enum:
            - latticini
            - carne
            - pesce
            - frutta
            - verdura
            - pasta
            - pane
            - surgelati
            - bevande
            - condimenti
            - snack
            - conserve
            - cereali
            - igiene
            - pulizia
            - altro
        unit:
          type: string
          enum: [pz, conf, g, ml]
        default_quantity:
          type: number
        package_size:
          type: number
        package_unit:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    ProductInput:
      type: object
      required: [name]
      properties:
        id:
          type: integer
          description: If provided, updates existing product
        name:
          type: string
        brand:
          type: string
        barcode:
          type: string
        category:
          type: string
        unit:
          type: string
        default_quantity:
          type: number
        package_size:
          type: number

    InventoryItem:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        quantity:
          type: number
        location:
          type: string
        expiry_date:
          type: string
          format: date
        opened:
          type: boolean
        created_at:
          type: string
          format: date-time

  responses:
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

tags:
  - name: Products
    description: Product catalog management
  - name: Inventory
    description: Inventory tracking (stock in/out)
  - name: Log
    description: Operations log and statistics
  - name: AI / Gemini
    description: Google Gemini AI integration (identification, recipes, chat)
  - name: Bring! Integration
    description: Bring! shopping list integration
  - name: Recipes
    description: Recipe storage
  - name: Notifications
    description: ntfy / webhook push notifications and the cron watchdog
  - name: Calendar
    description: ICS / WebCal expiry feed
  - name: Settings
    description: Application and server settings
  - name: TTS
    description: Text-to-Speech proxy
