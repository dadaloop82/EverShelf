<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <!-- Licence mark: a shield with a check, drawn for the splash badge next to the SPDX
       code (`MIT`, from the repository's LICENSE file — the badge must never claim a
