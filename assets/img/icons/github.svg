<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- GitHub mark (the official Octocat path, 16×16).
       It is the one brand asset this app may draw outside GitHub's own pages: the mark is used
       ONLY to link to the project's repository (splash and Settings → About), never as decoration
       and never recoloured to the app's emerald — the mark keeps its own neutral slate so it reads
       as "this is GitHub", not as another button of ours.
       Same construction as assets/img/icons/medicine.svg: plain shapes, no external references,
       no white plate behind it (the splash canvas shows through), so the browser, the Android
       WebView and a PNG preview all draw it the same. -->
